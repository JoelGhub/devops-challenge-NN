version: 0.2

env:
  variables:
    TRIVY_VERSION: "0.50.4"
    SEVERITY: "CRITICAL"
    AWS_DEFAULT_REGION: "eu-west-3"
  parameter-store:
    ECR_REGISTRY: "/devops/ecr/registry"

phases:
  install:
    commands:
      - echo "Installing Trivy (latest)"
      - curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      - trivy --version
      - nohup /usr/local/bin/dockerd --host=unix:///var/run/docker.sock &
      - timeout 15 sh -c "until docker info; do echo waiting; sleep 1; done"

  pre_build:
    commands:
      - cat "$CODEBUILD_SRC_DIR_BuildOutput/image-info.json"
      - IMAGE_URI=$(python3 -c "import json; print(json.load(open('$CODEBUILD_SRC_DIR_BuildOutput/image-info.json'))['imageUri'])")
      - echo "Scanning $IMAGE_URI"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

  build:
    commands:
      - echo "Running Trivy CRITICAL scan"
      - trivy image --severity CRITICAL,HIGH --exit-code 0 --ignore-unfixed --no-progress --format table "$IMAGE_URI" 2>&1 | tee trivy-summary.txt
      - trivy image --severity CRITICAL --exit-code 0 --ignore-unfixed --no-progress --format json --output trivy-report.json "$IMAGE_URI"
      - CRITICAL_COUNT=$(python3 -c "import json; d=json.load(open('trivy-report.json')); print(sum(len(r.get('Vulnerabilities') or []) for r in d.get('Results',[])))")
      - echo "CRITICAL CVEs with fix available $CRITICAL_COUNT"
      - echo "Scan complete - see trivy-report.json for full results"

  post_build:
    commands:
      - cp "$CODEBUILD_SRC_DIR_BuildOutput/image-info.json" image-info-scanned.json
      - echo "Scan complete"

artifacts:
  files:
    - image-info-scanned.json
    - trivy-report.json
    - trivy-summary.txt
  name: ScanOutput
