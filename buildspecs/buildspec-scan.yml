version: 0.2

env:
  variables:
    TRIVY_VERSION: "0.50.4"
    SEVERITY: "CRITICAL"
    AWS_DEFAULT_REGION: "eu-west-3"
  parameter-store:
    ECR_REGISTRY: "/devops/ecr/registry"

phases:
  install:
    commands:
      - echo "Installing Trivy $TRIVY_VERSION"
      - curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | tar -xz -C /usr/local/bin trivy
      - trivy --version
      - nohup /usr/local/bin/dockerd --host=unix:///var/run/docker.sock &
      - timeout 15 sh -c "until docker info; do echo waiting; sleep 1; done"

  pre_build:
    commands:
      - cat "$CODEBUILD_SRC_DIR_BuildOutput/image-info.json"
      - IMAGE_URI=$(python3 -c "import json; print(json.load(open('$CODEBUILD_SRC_DIR_BuildOutput/image-info.json'))['imageUri'])")
      - echo "Scanning $IMAGE_URI"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

  build:
    commands:
      - echo "Running Trivy CRITICAL scan"
      - trivy image --severity "$SEVERITY" --exit-code 1 --no-progress --format json --output trivy-report.json "$IMAGE_URI" || (echo "PIPELINE FAILED CRITICAL CVEs DETECTED" && exit 1)
      - echo "SCAN PASSED no CRITICAL vulnerabilities"

  post_build:
    commands:
      - cp "$CODEBUILD_SRC_DIR_BuildOutput/image-info.json" image-info-scanned.json
      - echo "Scan complete"

artifacts:
  files:
    - image-info-scanned.json
    - trivy-report.json
  name: ScanOutput
