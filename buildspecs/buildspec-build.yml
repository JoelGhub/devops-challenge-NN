version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: "eu-west-3"
  parameter-store:
    ECR_REPO_URI: "/devops/ecr/repo-uri"
    ECR_REGISTRY: "/devops/ecr/registry"

phases:
  install:
    runtime-versions:
      java: corretto17
    commands:
      - echo "Installing Docker CLI"
      - nohup /usr/local/bin/dockerd --host=unix:///var/run/docker.sock &
      - timeout 15 sh -c "until docker info; do echo waiting; sleep 1; done"

  pre_build:
    commands:
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - BUILD_TAG="build-${COMMIT_HASH}"
      - IMAGE_URI="${ECR_REPO_URI}:${BUILD_TAG}"
      - echo "Image will be pushed as $IMAGE_URI"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

  build:
    commands:
      - echo "Building Spring Boot application"
      - mvn clean package -DskipTests -B --no-transfer-progress
      - echo "Building Docker image"
      - docker build --pull --no-cache -t "$IMAGE_URI" .
      - echo "Pushing image to ECR"
      - docker push "$IMAGE_URI"

  post_build:
    commands:
      - IMAGE_DIGEST=$(aws ecr describe-images --repository-name "$(basename $ECR_REPO_URI)" --image-ids imageTag="$BUILD_TAG" --region "$AWS_DEFAULT_REGION" --query 'imageDetails[0].imageDigest' --output text)
      - echo "Digest $IMAGE_DIGEST"
      - printf '{"imageUri":"%s","imageTag":"%s","imageDigest":"%s","commitHash":"%s","buildId":"%s"}' "$IMAGE_URI" "$BUILD_TAG" "$IMAGE_DIGEST" "$COMMIT_HASH" "$CODEBUILD_BUILD_ID" > image-info.json
      - cat image-info.json

artifacts:
  files:
    - image-info.json
  name: BuildOutput
