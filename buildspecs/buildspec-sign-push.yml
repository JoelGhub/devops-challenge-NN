version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: "eu-west-3"
  parameter-store:
    ECR_REPO_URI: "/devops/ecr/repo-uri"
    ECR_REGISTRY: "/devops/ecr/registry"
    KMS_KEY_ARN:  "/devops/cosign/kms-key-arn"

phases:
  install:
    commands:
      - echo "Installing cosign $COSIGN_VERSION"
      - curl -sSfLo /usr/local/bin/cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
      - chmod +x /usr/local/bin/cosign
      - cosign version
      - nohup /usr/local/bin/dockerd --host=unix:///var/run/docker.sock &
      - timeout 15 sh -c "until docker info; do echo waiting; sleep 1; done"

  pre_build:
    commands:
      - cat "$CODEBUILD_SRC_DIR_ScanOutput/image-info-scanned.json"
      - BUILD_TAG=$(python3 -c "import json; print(json.load(open('$CODEBUILD_SRC_DIR_ScanOutput/image-info-scanned.json'))['imageTag'])")
      - COMMIT_HASH=$(python3 -c "import json; print(json.load(open('$CODEBUILD_SRC_DIR_ScanOutput/image-info-scanned.json'))['commitHash'])")
      - BUILD_URI="${ECR_REPO_URI}:${BUILD_TAG}"
      - RELEASE_TAG="${COMMIT_HASH}"
      - RELEASE_URI="${ECR_REPO_URI}:${RELEASE_TAG}"
      - echo "Build $BUILD_URI  Release $RELEASE_URI"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

  build:
    commands:
      - echo "Pulling build image"
      - docker pull "$BUILD_URI"
      - echo "Re-tagging as release"
      - docker tag "$BUILD_URI" "$RELEASE_URI"
      - docker push "$RELEASE_URI"
      - IMAGE_DIGEST=$(aws ecr describe-images --repository-name "$(basename $ECR_REPO_URI)" --image-ids imageTag="$RELEASE_TAG" --region "$AWS_DEFAULT_REGION" --query 'imageDetails[0].imageDigest' --output text)
      - IMAGE_WITH_DIGEST="${ECR_REPO_URI}@${IMAGE_DIGEST}"
      - echo "Signing $IMAGE_WITH_DIGEST"
      - cosign sign --key "awskms:///${KMS_KEY_ARN}" --tlog-upload=false --yes "$IMAGE_WITH_DIGEST"

  post_build:
    commands:
      - echo "Verifying signature"
      - cosign verify --key "awskms:///${KMS_KEY_ARN}" --insecure-ignore-tlog=true "$IMAGE_WITH_DIGEST"
      - echo "Signature OK"
      - printf '{"imageUri":"%s","imageTag":"%s","imageDigest":"%s","imageRef":"%s","kmsKeyArn":"%s","signed":true,"buildId":"%s"}' "$RELEASE_URI" "$RELEASE_TAG" "$IMAGE_DIGEST" "$IMAGE_WITH_DIGEST" "$KMS_KEY_ARN" "$CODEBUILD_BUILD_ID" > signed-image-info.json
      - cat signed-image-info.json

artifacts:
  files:
    - signed-image-info.json
  name: SignedOutput
