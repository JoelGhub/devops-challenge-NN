version: 0.2

env:
  variables:
    ENVIRONMENT: "staging"
    NAMESPACE: "springboot-staging"
    HELM_RELEASE: "springboot-app-staging"
    EKS_CLUSTER: "springboot-cluster-staging"
    AWS_DEFAULT_REGION: "eu-west-3"

phases:
  pre_build:
    commands:
      - cat "$CODEBUILD_SRC_DIR_SignedOutput/signed-image-info.json"
      - IMAGE_REF=$(python3 -c "import json; print(json.load(open('$CODEBUILD_SRC_DIR_SignedOutput/signed-image-info.json'))['imageRef'])")
      - IMAGE_TAG=$(python3 -c "import json; print(json.load(open('$CODEBUILD_SRC_DIR_SignedOutput/signed-image-info.json'))['imageTag'])")
      - IMAGE_DIGEST=$(python3 -c "import json; print(json.load(open('$CODEBUILD_SRC_DIR_SignedOutput/signed-image-info.json'))['imageDigest'])")
      - IMAGE_REPO=$(python3 -c "import json; d=json.load(open('$CODEBUILD_SRC_DIR_SignedOutput/signed-image-info.json')); print(d['imageUri'].rsplit(':', 1)[0])")
      - echo "=== DEPLOY SIMULATION - $ENVIRONMENT ==="
      - echo "Image $IMAGE_REF"

  build:
    commands:
      - echo "[SIMULATED] aws eks update-kubeconfig --name $EKS_CLUSTER --region $AWS_DEFAULT_REGION"
      - echo "[SIMULATED] kubectl create namespace $NAMESPACE"
      - echo "[SIMULATED] cosign verify --key awskms:///... $IMAGE_REF"
      - echo "[SIMULATED] helm upgrade --install $HELM_RELEASE helm/springboot-app --namespace $NAMESPACE --set image.repository=$IMAGE_REPO --set image.digest=$IMAGE_DIGEST --atomic --wait"
      - echo "[SIMULATED] kubectl get pods -n $NAMESPACE"
      - echo "Deploy simulation to $ENVIRONMENT completed successfully"

  post_build:
    commands:
      - echo "=== $ENVIRONMENT deployment simulation DONE ==="
      - echo "Would have deployed $IMAGE_TAG to EKS cluster $EKS_CLUSTER namespace $NAMESPACE"
      - echo "[SIMULATED] SSM audit trail written to /devops/deployments/$ENVIRONMENT/last-image-digest"
