---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: springboot-app
  namespace: springboot-dev    # change per environment
  labels:
    app.kubernetes.io/name: springboot-app
    app.kubernetes.io/managed-by: kubectl
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
    # TLS redirect for prod
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: springboot-app-dev.internal   # change per environment
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: springboot-app
                port:
                  number: 80
  # Uncomment for prod TLS:
  # tls:
  #   - hosts:
  #       - springboot-app.company.com
  #     secretName: springboot-app-tls
