---
apiVersion: v1
kind: Service
metadata:
  name: springboot-app
  namespace: springboot-dev    # change per environment
  labels:
    app.kubernetes.io/name: springboot-app
    app.kubernetes.io/managed-by: kubectl
spec:
  type: ClusterIP
  selector:
    app: springboot-app
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
