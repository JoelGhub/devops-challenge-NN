---
# =============================================================
# Raw Kubernetes Deployment manifest (reference / non-Helm)
# In production, use the Helm chart instead.
# Replace <IMAGE_URI> and <IMAGE_DIGEST> with actual values.
# =============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-app
  namespace: springboot-dev           # change per environment
  labels:
    app.kubernetes.io/name: springboot-app
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: kubectl
  annotations:
    # Audit: image signed with cosign
    cosign.sigstore.dev/signed: "true"
    cosign.sigstore.dev/imageDigest: "<IMAGE_DIGEST>"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: springboot-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: springboot-app
        version: "1.0.0"
      annotations:
        cosign.sigstore.dev/signed: "true"
        cosign.sigstore.dev/imageDigest: "<IMAGE_DIGEST>"
    spec:
      # Security hardening
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault

      # Use exact digest to guarantee signed image is deployed
      containers:
        - name: springboot-app
          # Use digest reference to prevent tag mutation attacks
          image: "<IMAGE_URI>@<IMAGE_DIGEST>"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "dev"
            - name: SERVER_PORT
              value: "8080"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3
      terminationGracePeriodSeconds: 30
