# =============================================================
# values-staging.yaml – Staging overrides
# =============================================================
replicaCount: 2

environment: "staging"

resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: springboot-app-staging.internal
      paths:
        - path: /
          pathType: Prefix
  tls: []
