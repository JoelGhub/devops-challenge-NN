# =============================================================
# values-dev.yaml – Development overrides
# =============================================================
replicaCount: 1

environment: "dev"

resources:
  requests:
    cpu: "250m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

autoscaling:
  enabled: false

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: springboot-app-dev.internal
      paths:
        - path: /
          pathType: Prefix
  tls: []
